name: Publish artifacts to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  publish:
    # Prevent infinite loop from the auto-commit pushed by this job
    if: "!contains(github.event.head_commit.message, 'Bump version to next incremental')"

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Generates ~/.m2/settings.xml with credentials for the `github`
          # server id referenced by <distributionManagement> in pom.xml.
          # Without this, `mvn deploy` uploads anonymously and gets a 401.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Bump Maven version
        run: |
          mvn -B build-helper:parse-version versions:set \
            -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} \
            versions:commit

      # Publish before committing the bump, so a failed deploy does not
      # leave an already-consumed version number behind in the repo.
      - name: Publish package
        run: mvn --batch-mode deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.ACTION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bump version to next incremental"
          git push origin main
